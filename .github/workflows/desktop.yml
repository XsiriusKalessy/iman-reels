name: App de escritorio

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon
            name: mac-arm64
          - os: macos-13      # Intel
            name: mac-intel
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    env:
      IMAN_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ".[recorte]" pyinstaller pytest httpx

      # ffmpeg estático (GPL, con libass y x264) como programa aparte, junto a la app.
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ff.zip
          mkdir -p packaging/bin
          cp ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe packaging/bin/
      - name: ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: |
          arch=$( [ "${{ matrix.name }}" = "mac-arm64" ] && echo arm64 || echo amd64 )
          mkdir -p packaging/bin
          for t in ffmpeg ffprobe; do
            curl -L -o $t.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/$t.zip"
            unzip -q -o $t.zip -d packaging/bin
          done
          chmod +x packaging/bin/*

      - name: Pruebas
        shell: bash
        run: |
          export PATH="$PWD/packaging/bin:$PATH"
          pytest -q

      - name: Empaquetar
        run: pyinstaller --noconfirm packaging/iman.spec

      - name: Comprobar el ejecutable
        if: runner.os == 'Windows'
        run: dist\Iman\Iman.exe --smoke
      - name: Comprobar la app
        if: runner.os == 'macOS'
        run: '"dist/Imán.app/Contents/MacOS/Iman" --smoke'

      - name: Instalador de Windows
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          iscc packaging\iman.iss
      - name: DMG de Mac
        if: runner.os == 'macOS'
        run: |
          mkdir dmg && cp -R "dist/Imán.app" dmg/ && ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname "Imán" -srcfolder dmg -ov -format UDZO "Iman-$IMAN_VERSION-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: iman-${{ matrix.name }}
          path: |
            packaging/Output/*.exe
            *.dmg
