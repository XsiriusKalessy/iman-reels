[project]
name = "iman-reels"
version = "0.1.0"
description = "Edita tus reels con IA: quita fallos, pone subtítulos y gancho, y exporta en vertical."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "faster-whisper>=1.0",
  "anthropic>=2.0",
  "openai>=1.40",
    "fonttools>=4.40",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Recorte de la persona (texto detrás, fondo liso o desenfocado). La app de escritorio lo lleva siempre.
recorte = ["mediapipe>=0.10.14", "numpy>=1.26"]

[project.scripts]
iman = "iman.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iman*"]

[tool.setuptools.package-data]
iman = ["web/*", "assets/fonts/*", "assets/models/*"]
